experiment:
  name: "paper_revision_main"
  paper_type: "empirical"
  target_method: "METHOD_PLACEHOLDER"
  tags: ["paper-improvement", "main-result"]

seed:
  policy: "multi"
  values: [0, 1, 2, 3, 4]

compute:
  max_gpu_hours: 24
  max_concurrent_jobs: 2
  accelerator: "gpu"
  precision: "fp16"

data:
  dataset_id: "DATASET_PLACEHOLDER"
  version: "v1"
  splits:
    train: "train"
    val: "val"
    test: "test"

model:
  family: "METHOD_FAMILY"
  backbone: "BACKBONE_PLACEHOLDER"

training:
  epochs: 50
  batch_size: 64
  optimizer:
    name: "adamw"
    lr: 3.0e-4
    weight_decay: 0.01
  scheduler:
    name: "cosine"
    warmup_steps: 2000

evaluation:
  primary_metric: "accuracy"
  additional_metrics: ["f1_macro"]
  ci:
    method: "bootstrap"
    confidence_level: 0.95

tracking:
  run_manifest: "artifacts/run_manifest.json"
  log_code: true
  log_env: true
  log_checkpoints: true
